# 기존 운영 서버의 MySQL named volume을 그대로 재사용하기 위한 Compose 프로젝트명이다.
# 데이터 마이그레이션 없이 변경하면 새 빈 DB 볼륨이 생성되므로 임의로 바꾸지 않는다.
name: smbility-prelab

# 배포용 구성. docker-compose.yml(로컬 개발용)과의 차이:
# - DB/백엔드 포트를 호스트에 열지 않는다 (nginx 컨테이너만 80번으로 외부에 노출된다)
# - nginx가 프론트 정적파일 서빙 + /api 리버스 프록시를 맡아 "서비스 URL 하나"로 통합한다
#
# 사용법 (VM에서):
#   cd infra && cp .env.prod.example .env   # 반드시 DB_PASSWORD/DB_ROOT_PASSWORD/JWT_SECRET을 실제 값으로 변경!
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#   방화벽(OCI 보안목록/NSG + ufw)에서 80(및 나중에 443) 포트만 열어둔다.

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-railcargo}
      MYSQL_USER: ${DB_USERNAME:-railcargo}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 설정하세요}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD를 .env에 설정하세요}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # 주의: 로컬 개발용과 달리 포트를 호스트에 열지 않는다 - backend 컨테이너만 도커 내부망으로 접근 가능.

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Seoul
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-railcargo}
      DB_USERNAME: ${DB_USERNAME:-railcargo}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 설정하세요}
      DB_TIMEZONE: UTC
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET을 .env에 설정하세요 (기본값 그대로 배포 금지)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SERVER_PORT: 8080
      AI_PROVIDER: ${AI_PROVIDER:-rule-based}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      DOCUMENT_AI_ENABLED: ${DOCUMENT_AI_ENABLED:-false}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      DOCUMENT_AI_LOCATION: ${DOCUMENT_AI_LOCATION:-us}
      DOCUMENT_AI_PROCESSOR_ID: ${DOCUMENT_AI_PROCESSOR_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/run/secrets/google-document-ai.json}
      DEMO_SCHEDULE_REFRESH_ENABLED: ${DEMO_SCHEDULE_REFRESH_ENABLED:-true}
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-true}
      OPERATOR_BOOTSTRAP_ENABLED: ${OPERATOR_BOOTSTRAP_ENABLED:-false}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-}
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
    volumes:
      - ./secrets:/run/secrets:ro
    # 주의: 호스트에 포트를 열지 않는다 - nginx가 도커 내부망(backend:8080)으로만 접근한다.

  nginx:
    build:
      context: ..
      dockerfile: infra/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./certbot/www:/var/www/certbot:ro

volumes:
  mysql_data:
