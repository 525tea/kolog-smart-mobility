spring:
  application:
    name: railcargo-api

  datasource:
    # connectionTimeZone=SERVER: 클라이언트(JVM)가 임의로 타임존을 가정하지 않고 MySQL 서버에 실제 설정된
    # 타임존을 그대로 사용한다. 이전에 고정값(Asia/Seoul)을 지정했을 때 컨테이너들이 실제로는 UTC로 떠 있어
    # LocalDateTime 비교 쿼리(예: 출발 예정 열차 조회)가 9시간 어긋나는 문제가 있었다.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:railcargo}?connectionTimeZone=${DB_TIMEZONE:UTC}&characterEncoding=UTF-8
    username: ${DB_USERNAME:railcargo}
    password: ${DB_PASSWORD:railcargo}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

server:
  port: ${SERVER_PORT:8080}

app:
  bootstrap:
    operator:
      enabled: ${OPERATOR_BOOTSTRAP_ENABLED:false}
      email: ${OPERATOR_EMAIL:}
      password: ${OPERATOR_PASSWORD:}
  demo:
    schedule-refresh-enabled: ${DEMO_SCHEDULE_REFRESH_ENABLED:false}
    seed-enabled: ${DEMO_DATA_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:local-development-secret-key-please-change-in-production-0123456789}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
    refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:2592000}
  client:
    min-supported-version: ${APP_MIN_SUPPORTED_VERSION:1.2.0}
    latest-version: ${APP_LATEST_VERSION:1.5.0}
    force-update: ${APP_FORCE_UPDATE:false}
    maintenance-active: ${APP_MAINTENANCE_ACTIVE:false}
    maintenance-message: ${APP_MAINTENANCE_MESSAGE:}
    container-capacity-cbm: ${APP_CONTAINER_CAPACITY_CBM:67.0}
    hold-minutes: ${APP_HOLD_MINUTES:15}
    classify-confidence-threshold: ${APP_CLASSIFY_CONFIDENCE_THRESHOLD:0.80}
    rule-db-version: ${APP_RULE_DB_VERSION:2026.07}
  ai:
    # rule-based(기본값, 키 불필요) | gemini(Google AI Studio 무료 API 키 필요)
    provider: ${AI_PROVIDER:rule-based}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.0-flash}
      endpoint: ${GEMINI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models}
    document-ai:
      enabled: ${DOCUMENT_AI_ENABLED:false}
      project-id: ${GOOGLE_CLOUD_PROJECT:}
      location: ${DOCUMENT_AI_LOCATION:us}
      processor-id: ${DOCUMENT_AI_PROCESSOR_ID:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.smbility.railcargo: INFO
    org.hibernate.SQL: DEBUG
